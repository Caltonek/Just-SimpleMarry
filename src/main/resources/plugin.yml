name: SimpleMarry
version: '${version}'
main: pl.caltonek.simpleMarry.SimpleMarry
api-version: '26.2'
load: STARTUP
authors: [ Caltonek ]
softdepend: [ LPC ]
commands:
  marry:
    aliases: [slub]
    usage: /marry <nick>
  marrydivorce:
    aliases: [rozwod]
    usage: /marrydivorce
  marrygift:
    aliases: [prezent]
    usage: /marrygift
  marrytp:
    aliases: [partnertp, partner]
    usage: /marrytp
  marrylist:
    aliases: [ listazwizkow ]
    usage: /marrylist
  marrychat:
    aliases: [ mchat ]
    usage: /marrychat
  marryreload:
    aliases: [ mreload ]
    usage: /marryreload
    permission: simple-marry.command.admin.reload

permissions:
  simple-marry.command.admin.reload:
    description: Fast config reload.
    default: op